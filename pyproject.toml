[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
timeout = 120
markers = [
    "gui: constructs a real Tk window and needs an interactive desktop session",
    "integration: exercises a real dependency (PyAV, the filesystem, a subprocess)",
    "slow: takes more than a second",
    "allow_network: permitted to call urllib.request.urlopen for real",
]

[tool.coverage.run]
source = ["src"]
branch = true
parallel = false

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["installer/build", "installer/dist_app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C4", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/*.py" = ["E402", "E702", "I001", "F541", "F841", "B007", "B023", "B905", "C408"]
"tests/*.py" = ["B011"]
